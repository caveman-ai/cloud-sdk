[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caveman-router"
version = "0.2.3"
description = "Embed Caveman model decisions in an existing gateway without proxying inference."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "ruamel.yaml>=0.18,<0.19"]

[project.optional-dependencies]
# Every filelock before 4.2.1 is in an advisory's range (GHSA-69hj-f68j-2879 reaches back to the
# first release), and LiteLLM 1.104 to 1.108.2 cap filelock below 4.0. 1.108.3 is the first LiteLLM
# that takes a fixed filelock, so the extra holds both.
litellm = ["litellm[proxy]==1.108.3", "fastapi==0.136.3", "filelock==4.2.4"]
tracing = ["opentelemetry-exporter-otlp-proto-http==1.45.2", "opentelemetry-instrumentation-fastapi==0.66b2"]

[project.scripts]
caveman-router = "caveman_router_setup:main"

[tool.setuptools]
py-modules = ["caveman_router", "caveman_router_client", "caveman_router_setup"]

[tool.pytest.ini_options]
testpaths = ["."]
markers = ["conformance: launches a real LiteLLM server and local HTTP fixtures"]

[tool.ruff]
line-length = 100
